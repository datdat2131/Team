name: AstraxTeam
version: 1.0.0
main: com.astraxbox.team.AstraxTeam
api-version: '1.20'
author: AstraxBox
description: Hệ thống team toàn diện - AstraxBox
softdepend: [PlaceholderAPI]
commands:
  ateam:
    description: Lệnh quản lý team (đặt tên khác /team để không đụng lệnh /team của Minecraft)
    usage: /ateam help
    aliases: [at, astraxteam]
    permission: astraxteam.use
  teamchest:
    description: Mở rương chung của team
    usage: /teamchest
    aliases: [tchest]
    permission: astraxteam.use
  teamchat:
    description: Chat riêng trong team
    usage: /tc [tin nhắn]
    aliases: [tc]
    permission: astraxteam.use
  teamadmin:
    description: Lệnh admin AstraxTeam
    usage: /teamadmin help
    aliases: [tadmin]
    permission: astraxteam.admin
permissions:
  astraxteam.use:
    default: true
  astraxteam.admin:
    default: op
  astraxteam.bypass:
    description: Bỏ qua bảo vệ khu vực claim
    default: op
